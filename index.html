<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="images/DeadAirLogo_Green_Outlined.png" type="image/png" />
  <title>Dead Air Collective</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="crt-screen">
    <div class="vhs">
      <video
        src="https://res.cloudinary.com/dhcl0fsay/video/upload/v1758365149/deadmeat-horror-awards-24/vhs_svgkmp.mp4"
        loop
        autoplay
        playsinline
        muted></video>
    </div>
    <div class="backgroundImage"></div>
    <div class="noise-overlay"></div>
    <div class="grain-overlay"></div>

      <!-- Collective Socials, hardcoded for good luck -->
      <section id="collective-socials">
        <a class="top-button top-left" href="https://discord.gg/du4GmpENyF" target="_blank">Join our Discord</a>
        <div class="socials">
          <a href="https://x.com/DeadAirCo" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          <a href="https://bsky.app/profile/deadaircollective.bsky.social" target="_blank" aria-label="Bluesky"><i class="fab fa-bluesky"></i></a>
          <a href="https://www.youtube.com/@DeadAirCollectiveTV" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
          <a href="mailto:contact@deadaircollective.com" target="_blank" aria-label="Email"><i class="fas fa-envelope"></i></a>
        </div>
        <span class="top-button top-right" aria-disabled="true">Merch Coming Soon</span>
      </section>
    <div class="container glow">
      <!-- Logo and Title Header -->
      <div id="header-with-logo">
        <div id="logo-section">
          <img src="images/DeadAirLogo_Green_Outlined.png" alt="Dead Air Collective Logo" class="site-logo">
        </div>
        <section id="about">
          <h1 class="glitch-text" data-text="Dead Air Collective">Dead Air Collective</h1>
          <p>...because dropped frames, disconnects, buffering and packet loss are features</p>
        </section>
      </div>

      <section id="members">
        <!-- Loaded dynamically -->
      </section>

    <div class="buttonmarquee">
      <marquee>
          <img src="images/buttons/forfirefox.png" alt="">
          <img src="images/buttons/mspaint.jpg" alt="">
          <img src="images/buttons/internetprivacynow.gif" alt="">
          <img src="images/buttons/ao3.gif" alt="">
      </marquee>
    </div>

    </div>
  </div>

<script>
  fetch('data.json')
    .then(response => response.json())
    .then(data => {
      const membersSection = document.getElementById('members');
      membersSection.innerHTML = '';

      data.members.forEach(member => {
        const memberDiv = document.createElement('div');
        memberDiv.className = 'member glow';

        // member image background
        if (member.image) {
          memberDiv.style.backgroundImage = `url('${member.image}')`;
          memberDiv.style.backgroundSize = 'cover';
          memberDiv.style.backgroundPosition = 'center';
          memberDiv.style.backgroundRepeat = 'no-repeat';
        }

        // Name
        const name = document.createElement('h3');
        const profileLink = document.createElement('a');
        const pageSlug = member.name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-');
        const profileUrl = `card.html?member=${encodeURIComponent(pageSlug)}`;
        const imageLink = document.createElement('a');
        imageLink.href = profileUrl;
        imageLink.className = 'member-image-link';
        imageLink.setAttribute('aria-label', `View ${member.name}'s profile`);
        memberDiv.appendChild(imageLink);
        profileLink.href = profileUrl;
        profileLink.className = 'member-profile-link';
        profileLink.textContent = member.name;
        name.appendChild(profileLink);
        memberDiv.appendChild(name);

        // Social icons container
        const socialsDiv = document.createElement('div');
        socialsDiv.className = 'socials';

        const addSocial = (platform, username, iconClass) => {
          const account = typeof username === 'string' ? username.trim() : '';
          if (!account) return;

          let url = '#';
          if (platform === 'twitch') url = `https://twitch.tv/${account}`;
          else if (platform === 'discord') url = `https://discord.gg/${account}`;
          else if (platform === 'twitter') url = `https://x.com/${account}`;
          else if (platform === 'instagram') url = `https://instagram.com/${account}`;
          else if (platform === 'bluesky') url = `https://bsky.app/profile/${account}`;
          else if (platform === 'youtube') url = `https://youtube.com/@${account}`;
          else if (platform === 'tiktok') url = `https://www.tiktok.com/@${account}`;

          const link = document.createElement('a');
          link.href = url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.setAttribute('aria-label', platform);
          const icon = document.createElement('i');
          icon.className = iconClass;
          link.appendChild(icon);
          socialsDiv.appendChild(link);
        };

        addSocial('twitch',   member.twitch,   'fa-brands fa-twitch');
        addSocial('discord',  member.discord,  'fa-brands fa-discord');
        addSocial('twitter',  member.twitter,  'fa-brands fa-twitter');
        addSocial('instagram', member.instagram, 'fa-brands fa-instagram');
        addSocial('bluesky',  member.bluesky,  'fa-brands fa-bluesky');
        addSocial('youtube',  member.youtube,  'fa-brands fa-youtube');
        addSocial('tiktok',   member.tiktok,   'fa-brands fa-tiktok'); 

        if (socialsDiv.children.length > 0) {
          memberDiv.appendChild(socialsDiv);
        }

        membersSection.appendChild(memberDiv);
      });
    })
    .catch(error => {
      console.error('Error loading members:', error);
      document.getElementById('members').innerHTML = 
        '<p style="text-align:center;color:#ff4444;">Members failed to load... what if they never come back?</p>';
    });
    const delay = Math.random() * 3;
    document.documentElement.style.setProperty('--random-delay', `${delay}s`);
</script>


     <section id="tv-section">
      <iframe src="TV.html" style="width: 100%; height: 1000px; border: none; margin: 100px 0;"></iframe>
     </section>

</body>
</html>
