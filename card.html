<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/DeadAirLogo_Green_Outlined.png" type="image/png" />
  <title>Card — Dead Air Collective</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="card.css" />
</head>
<body class="profile-page">
  <div class="crt-screen">
    <div class="container glow">
      <header class="profile-header-bar">
        <div class="profile-title">
          <h1 id="memberName">Loading...</h1>
        </div>
      </header>

      <div class="profile-content">
        <div class="profile-hero no-artwork">
          <div class="profile-artwork-panel" id="memberArtworkPanel" hidden>
            <div class="profile-artwork">
              <img id="memberArtwork" alt="" />
            </div>
          </div>

          <div class="profile-details">
            <section class="profile-bio">
              <h2>About</h2>
              <p id="memberBio"></p>
              <div class="profile-about-actions" id="memberReferences"></div>
            </section>

            <section class="profile-links">
              <h2>Connect</h2>
              <div class="profile-link-list" id="memberLinks"></div>
            </section>
          </div>
        </div>

        <div class="profile-footer-layer">
          <footer class="profile-footer">
          <a class="profile-logo-link" href="index.html" aria-label="Dead Air Collective Home">
            <img src="images/DeadAirLogo_Green_Outlined.png" alt="Dead Air Collective Logo" />
          </a>
          </footer>
        </div>
      </div>
    </div>
  </div>

  <script>
    const memberSlug = new URLSearchParams(window.location.search).get('member') || '';
    const slugName = memberSlug.trim().toLowerCase();
    const slugify = value => value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    const linkMap = {
      twitch: username => `https://twitch.tv/${username}`,
      discord: username => /^https?:\/\//i.test(username) ? username : `https://discord.gg/${username}`,
      twitter: username => `https://x.com/${username}`,
      instagram: username => `https://instagram.com/${username}`,
      bluesky: username => /^https?:\/\//i.test(username) ? username : `https://bsky.app/profile/${username}`,
      youtube: username => `https://youtube.com/@${username}`,
      tiktok: username => `https://www.tiktok.com/@${username}`,
    };

    const iconMap = {
      twitch: 'fa-brands fa-twitch',
      discord: 'fa-brands fa-discord',
      twitter: 'fa-brands fa-twitter',
      instagram: 'fa-brands fa-instagram',
      bluesky: 'fa-brands fa-bluesky',
      youtube: 'fa-brands fa-youtube',
      tiktok: 'fa-brands fa-tiktok',
    };

    async function loadProfile() {
      const memberName = document.getElementById('memberName');
      const memberBio = document.getElementById('memberBio');
      const memberArtwork = document.getElementById('memberArtwork');
      const artworkPanel = document.getElementById('memberArtworkPanel');
      const profileHero = document.querySelector('.profile-hero');
      const links = document.getElementById('memberLinks');
      const references = document.getElementById('memberReferences');

      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error('Profile data request failed.');

        const data = await response.json();
        const member = Array.isArray(data.members)
          ? data.members.find(item => slugify(item.name) === slugName)
          : null;

        if (!member) {
          memberName.textContent = 'Member not found';
          memberBio.textContent = 'No data available.';
          return;
        }

        memberName.textContent = member.name;
        memberBio.textContent = member.biography || 'No data available.';

        if (member.artwork) {
          memberArtwork.src = member.artwork;
          memberArtwork.alt = `${member.name} artwork`;
          artworkPanel.hidden = false;
          profileHero.classList.remove('no-artwork');
        }

        Object.entries(iconMap).forEach(([platform, iconClass]) => {
          const username = typeof member[platform] === 'string' ? member[platform].trim() : '';
          if (!username) return;

          const link = document.createElement('a');
          const icon = document.createElement('i');
          const label = platform.charAt(0).toUpperCase() + platform.slice(1);
          icon.className = iconClass;
          link.href = linkMap[platform](username);
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.append(icon, document.createTextNode(label));
          links.appendChild(link);
        });

        const specialButton = member.specialButton;
        if (specialButton?.title && specialButton?.url) {
          const link = document.createElement('a');
          const icon = document.createElement('i');
          icon.className = 'fa-solid fa-pen-nib';
          link.className = 'special-link';
          link.href = specialButton.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.append(icon, document.createTextNode(specialButton.title));
          links.appendChild(link);
        }

        if (member.references) {
          const link = document.createElement('a');
          const icon = document.createElement('i');
          icon.className = 'fa-solid fa-images';
          link.className = 'references-link';
          link.href = member.references;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.append(icon, document.createTextNode('References'));
          references.appendChild(link);
        }

        if (!links.childElementCount) links.textContent = 'No social links available.';
      } catch {
        memberName.textContent = 'Unable to load profile';
        memberBio.textContent = 'There was a problem loading profile data.';
      }
    }

    loadProfile();
  </script>
</body>
</html>
